name: Refresh and Deploy

# 每 30 分钟运行一次:
#  - OpenVPN 节点: 每次都刷新
#  - CF 优选池: 仅周日 11:00 (北京时间) 或手动触发时刷新
# 数据文件只在运行时生成, 直接发布到 GitHub Pages, 不提交到仓库
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract OpenVPN nodes
        env:
          OVPN_CHECK_TIMEOUT: "5"
          OVPN_WORKERS: "32"
        run: python refresh_ovpn.py

      - name: Refresh edge pool (Sundays 11:00 Beijing / manual only)
        env:
          EDT_DOMAIN: ${{ secrets.EDT_DOMAIN }}
          EDT_UUID: ${{ secrets.EDT_UUID }}
          POOL_SIZE: "40"
          SAMPLE_SIZE: "300"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%w%H)" = "003" ]; then
            echo "执行优选池刷新"
            python refresh_pool.py
          else
            echo "跳过优选池刷新 (仅周日 11:00 北京时间执行)"
          fi

      - name: Prepare site
        run: |
          mkdir -p site
          for f in edge_pool.txt edge_pool.json sub.txt openvpn.zip openvpn.txt openvpn.yaml openvpn.json; do
            [ -f "$f" ] && cp "$f" site/ && echo "已加入: $f"
          done
          [ -f web/index.html ] && cp web/index.html site/index.html && echo "已加入: index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
