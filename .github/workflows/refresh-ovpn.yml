name: Refresh OpenVPN Nodes

# 每 30 分钟从 VPN Gate 提取一次 OpenVPN 节点, 也支持手动触发
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract OpenVPN nodes
        env:
          OVPN_CHECK_TIMEOUT: "5"
          OVPN_WORKERS: "32"
        run: python refresh_ovpn.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openvpn.zip openvpn.txt openvpn.yaml openvpn.json

          git diff --cached --quiet && echo "节点无变化, 跳过提交" && exit 0
          git commit -m "chore: refresh openvpn nodes $(date -u +%Y-%m-%dT%H:%M)"
          git push
