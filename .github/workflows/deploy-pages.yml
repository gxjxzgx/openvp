name: Deploy to GitHub Pages

# 数据文件有更新时自动发布到 Pages, 也支持手动触发
on:
  push:
    branches: [main]
    paths:
      - 'edge_pool.txt'
      - 'edge_pool.json'
      - 'sub.txt'
      - 'openvpn.zip'
      - 'openvpn.txt'
      - 'openvpn.yaml'
      - 'openvpn.json'
      - 'web/index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site
          for f in edge_pool.txt edge_pool.json sub.txt openvpn.zip openvpn.txt openvpn.yaml openvpn.json; do
            [ -f "$f" ] && cp "$f" site/ && echo "已加入: $f"
          done
          [ -f web/index.html ] && cp web/index.html site/index.html && echo "已加入: index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
